<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JANAKINATH BHANDER</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7fb;
  color:#222;
}

header{
  background:linear-gradient(135deg,#0d6efd,#0056b3);
  color:white;
  padding:18px 15px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:50;
}

header h1{
  font-size:24px;
  margin-bottom:12px;
}

.search-box{
  max-width:600px;
  margin:auto;
}

.search-box input{
  width:100%;
  padding:13px 16px;
  border:none;
  border-radius:25px;
  outline:none;
  font-size:15px;
}

.top-buttons{
  margin-top:12px;
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}

button{
  border:none;
  cursor:pointer;
}

.admin-btn,
.whatsapp-main{
  padding:10px 16px;
  border-radius:20px;
  color:white;

}

.admin-btn{
  background:#222;
}

.whatsapp-main{
  background:#16a34a;
}

.categories{
  padding:14px 10px;
  display:flex;
  gap:8px;
  overflow-x:auto;
  background:white;
  position:sticky;
  top:117px;
  z-index:40;
}

.categories button{
  background:#e9eef5;
  padding:9px 15px;
  border-radius:20px;
  white-space:nowrap;
}

.categories button.active{
  background:#0d6efd;
  color:white;
}

#products{
  max-width:1200px;
  margin:20px auto;
  padding:0 12px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:15px;

.product-card{
  background:white;

  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  padding-bottom:14px;
}

.product-card img{
  width:100%;
  height:190px;
  object-fit:cover;
  background:#eee;
}

.product-info{
  padding:13px;
}

.product-info h3{
  font-size:17px;
  margin-bottom:7px;
}

.type{
  display:inline-block;
  background:#e8f1ff;
  color:#0d6efd;
  padding:4px 8px;
  border-radius:12px;
  font-size:12px;
  margin-bottom:8px;
}

.company{
  color:#666;
  font-size:13px;
  margin-bottom:8px;
}

.price{
  font-size:19px;
  font-weight:bold;
  color:#159447;
  margin-bottom:10px;
}

.details-btn{
  width:100%;
  padding:10px;
  border-radius:8px;
  background:#0d6efd;
  color:white;
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:40px 10px;
  color:#777;
  grid-column:1/-1;
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal-box{
  background:white;
  width:100%;
  max-width:500px;
  max-height:92vh;
  overflow-y:auto;
  border-radius:15px;
  padding:20px;
  position:relative;
}

.close{
  position:absolute;
  right:14px;
  top:10px;
  font-size:25px;
  cursor:pointer;
  color:#555;
}

.modal-box h2{
  margin-bottom:15px;
  color:#0d6efd;
}

.modal-box input,
.modal-box select,
.modal-box textarea{
  width:100%;
  padding:11px;
  margin:6px 0 10px;
  border:1px solid #ddd;
  border-radius:8px;
  outline:none;
}

.modal-box textarea{
  min-height:90px;
  resize:vertical;
}

.form-label{
  font-size:13px;
  font-weight:bold;
  color:#444;
}

.submit-btn{
  width:100%;
  padding:12px;
  background:#0d6efd;
  color:white;
  border-radius:8px;
  font-weight:bold;
  margin-top:5px;
}

.logout-btn{
  width:100%;
  padding:11px;
  background:#dc3545;
  color:white;
  border-radius:8px;
  font-weight:bold;
  margin-top:8px;
}

.cancel-btn{
  width:100%;
  padding:11px;
  background:#777;
  color:white;
  border-radius:8px;
  font-weight:bold;
  margin-top:8px;
}

/* CUSTOM TYPE */
#customTypeBox{
  display:none;
}

.custom-type-note{
  font-size:12px;
  color:#777;
  margin-top:-5px;
  margin-bottom:8px;
}

/* DETAILS */
.details-img{
  width:100%;
  max-height:280px;
  object-fit:contain;
  border-radius:10px;
  background:#f5f5f5;
  margin-bottom:15px;
}

.detail-row{
  padding:8px 0;
  border-bottom:1px solid #eee;
}

.detail-row b{
  color:#444;
}

.wa-btn{
  width:100%;
  padding:12px;
  background:#25D366;
  color:white;
  border-radius:8px;
  font-weight:bold;
  margin-top:15px;
}

/* WHATSAPP OPTIONS */
.wa-option{
  width:100%;
  padding:13px;
  margin:7px 0;
  border-radius:9px;
  background:#25D366;
  color:white;
  font-weight:bold;
}

.wa-option.second{
  background:#128C7E;
}

@media(max-width:600px){
  header h1{
    font-size:21px;
  }

  .categories{
    top:113px;
  }

  #products{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .product-card img{
    height:145px;
  }

  .product-info{
    padding:10px;
  }

  .product-info h3{
    font-size:15px;
  }

  .price{
    font-size:17px;
  }
}
</style>
</head>

  <div class="modal-box">

<!-- FIREBASE -->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  updateDoc,
  deleteDoc,
  doc
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyAvW--1xLttocESRPTR2NRAd_SHI90pIq0",
  authDomain: "janakinath-bhander.firebaseapp.com",
  projectId: "janakinath-bhander",
  storageBucket: "janakinath-bhander.firebasestorage.app",
  messagingSenderId: "180668389458",
  appId: "1:180668389458:web:eb0aa44c8030373ff3a78b",
  measurementId: "G-DKL4LQT2VY"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_UID = "estDvqfCQHWVYXM8sanrqIUniey1";

let products = [];
let selectedProduct = null;
let currentCategory = "All";


/* =========================
   TYPE CHANGE
========================= */

window.handleTypeChange = function(){

  const type = document.getElementById("productType").value;

  const customBox = document.getElementById("customTypeBox");
  const customInput = document.getElementById("customProductType");

  if(type === "Others"){

    customBox.style.display = "block";
    customInput.required = true;

  }else{

    customBox.style.display = "none";
    customInput.required = false;
    customInput.value = "";
  }
};


/* =========================
   LOGIN
========================= */

window.openLogin = function(){

  document.getElementById("loginModal").style.display = "flex";
};


window.adminLogin = async function(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if(!email || !password){

    alert("Please enter Gmail and Password.");
    return;
  }

  try{

    const result =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    if(result.user.uid !== ADMIN_UID){

      await signOut(auth);

      alert("Access denied. You are not the Admin.");
      return;
    }

    document.getElementById("loginModal").style.display = "none";

    document.getElementById("adminModal").style.display = "flex";

    alert("Admin Login Successful!");

  }catch(error){

    alert("Login failed. Please check Gmail and Password.");
  }
};


window.adminLogout = async function(){

  await signOut(auth);

  document.getElementById("adminModal").style.display = "none";

  alert("Logged out.");
};


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(auth, user => {

  if(user && user.uid === ADMIN_UID){

    console.log("Admin authenticated.");

  }

});


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  try{

    const snapshot =
      await getDocs(collection(db,"products"));

    products = [];

    snapshot.forEach(item => {

      products.push({
        id:item.id,
        ...item.data()
      });

    });

    renderProducts();

  }catch(error){

    console.error(error);

    document.getElementById("products").innerHTML =
      `<div class="empty">
        Unable to load products.
      </div>`;
  }
}


/* =========================
   RENDER PRODUCTS
========================= */

window.renderProducts = function(){

  const container =
    document.getElementById("products");

  const search =
    document.getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

  let filtered = products.filter(product => {

    const name =
      String(product.name || "").toLowerCase();

    const company =
      String(product.company || "").toLowerCase();

    const type =
      String(product.type || "").toLowerCase();

    const matchesSearch =
      name.includes(search) ||
      company.includes(search) ||
      type.includes(search);

    const matchesCategory =
      currentCategory === "All" ||
      type === currentCategory.toLowerCase();

    return matchesSearch && matchesCategory;
  });


  if(filtered.length === 0){

    container.innerHTML =
      `<div class="empty">
        No products found.
      </div>`;

    return;
  }


  container.innerHTML = filtered.map(product => {

    const image =
      product.image ||
      "https://via.placeholder.com/500x400?text=JANAKINATH+BHANDER";

    return `
      <div class="product-card">

        <img
          src="${image}"
          onerror="this.src='https://via.placeholder.com/500x400?text=JANAKINATH+BHANDER'"
        >

        <div class="product-info">

          <h3>${escapeHTML(product.name || "")}</h3>

          <span class="type">
            ${escapeHTML(product.type || "")}
          </span>

          <div class="company">
            ${escapeHTML(product.company || "")}
          </div>

          <div class="price">
            ₹${escapeHTML(String(product.price || ""))}
          </div>

          <button
            class="details-btn"
            onclick="showDetails('${product.id}')"
          >
            View Details
          </button>

        </div>
      </div>
    `;

  }).join("");
};


/* =========================
   CATEGORY
========================= */

window.setCategory = function(category,button){

  currentCategory = category;

  document
    .querySelectorAll(".categories button")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  renderProducts();
};


/* =========================
   SHOW DETAILS
========================= */

window.showDetails = function(id){

  const product =
    products.find(p => p.id === id);

  if(!product) return;

  selectedProduct = product;

  document.getElementById("detailsImage").src =
    product.image ||
    "https://via.placeholder.com/500x400?text=JANAKINATH+BHANDER";

  document.getElementById("detailsName").textContent =
    product.name || "";

  document.getElementById("detailsPrice").textContent =
    product.price || "";

  document.getElementById("detailsType").textContent =
    product.type || "";

  document.getElementById("detailsCompany").textContent =
    product.company || "";

  document.getElementById("detailsPack").textContent =
    product.pack || "";

  document.getElementById("detailsStock").textContent =
    product.stock || "";

  document.getElementById("detailsCode").textContent =
    product.code || "";

  document.getElementById("detailsDescription").textContent =
    product.description || "";

  document.getElementById("detailsModal").style.display = "flex";
};


/* =========================
   WHATSAPP OPTIONS
========================= */

window.openWhatsAppOptions = function(){

  if(!selectedProduct && products.length > 0){

    alert("Please open a product first.");
    return;
  }

  document.getElementById("whatsappModal").style.display = "flex";
};


window.sendWhatsApp = function(number){

  if(!selectedProduct){

    alert("Please select a product first.");
    return;
  }

  const p = selectedProduct;

  const message =
`Hello JANAKINATH BHANDER,

This product is available:

Product Name: ${p.name || ""}
Price: ₹${p.price || ""}
Type: ${p.type || ""}
Company: ${p.company || ""}
Pack Size: ${p.pack || ""}
Product Code: ${p.code || ""}

I want to know more about this product.`;

  const url =
    "https://wa.me/" +
    number +
    "?text=" +
    encodeURIComponent(message);

  window.open(url,"_blank");

  document.getElementById("whatsappModal").style.display = "none";
};


/* =========================
   SAVE PRODUCT
========================= */

window.saveProduct = async function(){

  const user = auth.currentUser;

  if(!user || user.uid !== ADMIN_UID){

    alert("Admin login required.");
    return;
  }


  const name =
    document.getElementById("productName").value.trim();

  const image =
    document.getElementById("productImage").value.trim();

  const price =
    document.getElementById("productPrice").value.trim();

  const selectedType =
    document.getElementById("productType").value;

  const customType =
    document.getElementById("customProductType")
    .value
    .trim();

  const company =
    document.getElementById("productCompany").value.trim();

  const pack =
    document.getElementById("productPack").value.trim();

  const stock =
    document.getElementById("productStock").value.trim();

  const code =
    document.getElementById("productCode").value.trim();

  const description =
    document.getElementById("productDescription").value.trim();


  if(!name || !price){

    alert("Product Name and Price are required.");
    return;
  }


  /* IMPORTANT:
     Others হলে custom type save হবে
  */

  let finalType = selectedType;

  if(selectedType === "Others"){

    if(!customType){

      alert("Please enter your Custom Type.");
      return;
    }

    finalType = customType;
  }


  const productData = {

    name:name,

    image:image,

    price:price,

    type:finalType,

    company:company,

    pack:pack,

    stock:stock,

    code:code,

    description:description
  };


  const editingId =
    document.getElementById("editingId").value;


  try{

    if(editingId){

      await updateDoc(
        doc(db,"products",editingId),
        productData
      );

      alert("Product updated successfully.");

    }else{

      await addDoc(
        collection(db,"products"),
        productData
      );

      alert("Product added successfully.");
    }


    clearForm();

    await loadProducts();

  }catch(error){

    console.error(error);

    alert(
      "Could not save product. Please check Firebase settings."
    );
  }
};


/* =========================
   EDIT PRODUCT
========================= */

window.editProduct = function(id){

  const product =
    products.find(p => p.id === id);

  if(!product) return;


  document.getElementById("editingId").value =
    product.id;

  document.getElementById("productName").value =
    product.name || "";

  document.getElementById("productImage").value =
    product.image || "";

  document.getElementById("productPrice").value =
    product.price || "";

  const standardTypes =
    ["Medicine","Syrup","Tablet","Capsule"];


  if(standardTypes.includes(product.type)){

    document.getElementById("productType").value =
      product.type;

    document.getElementById("customProductType").value = "";

  }else{

    document.getElementById("productType").value =
      "Others";

    document.getElementById("customProductType").value =
      product.type || "";
  }


  handleTypeChange();


  document.getElementById("productCompany").value =
    product.company || "";

  document.getElementById("productPack").value =
    product.pack || "";

  document.getElementById("productStock").value =
    product.stock || "";

  document.getElementById("productCode").value =
    product.code || "";

  document.getElementById("productDescription").value =
    product.description || "";

  document.getElementById("adminModal").style.display = "flex";
};


/* =========================
   DELETE PRODUCT
========================= */

window.deleteProduct = async function(id){

  const user = auth.currentUser;

  if(!user || user.uid !== ADMIN_UID){

    alert("Admin login required.");
    return;
  }


  if(!confirm("Delete this product?")) return;


  try{

    await deleteDoc(
      doc(db,"products",id)
    );

    alert("Product deleted.");

    await loadProducts();

  }catch(error){

    console.error(error);

    alert("Could not delete product.");
  }
};


/* =========================
   CANCEL / CLEAR
========================= */

window.cancelEdit = function(){

  clearForm();
};


function clearForm(){

  document.getElementById("editingId").value = "";

  document.getElementById("productName").value = "";

  document.getElementById("productImage").value = "";

  document.getElementById("productPrice").value = "";

  document.getElementById("productType").value = "Medicine";

  document.getElementById("customProductType").value = "";

  document.getElementById("productCompany").value = "";

  document.getElementById("productPack").value = "";

  document.getElementById("productStock").value = "";

  document.getElementById("productCode").value = "";

  document.getElementById("productDescription").value = "";

  handleTypeChange();
}


/* =========================
   CLOSE MODAL
========================= */

window.closeModal = function(id){

  document.getElementById(id).style.display = "none";
};


/* =========================
   HTML SECURITY
========================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   START
