<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JANAKINATH BHANDER</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#087f5b,#12b886);
  color:#fff;
  padding:16px 14px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 3px 15px rgba(0,0,0,.15)
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px
}

.logo{
  font-size:20px;
  font-weight:800
}

.admin-btn{
  border:0;
  background:#fff;
  color:#087f5b;
  padding:10px 14px;
  border-radius:9px;
  font-weight:700;
  cursor:pointer
}

.hero{
  max-width:1100px;
  margin:20px auto;
  padding:30px 18px;
  background:#fff;
  border-radius:18px;
  text-align:center;
  box-shadow:0 3px 15px rgba(0,0,0,.06)
}

.hero h1{
  color:#087f5b;
  margin-bottom:8px;
  font-size:28px
}

.hero p{color:#687386}

.search-box{
  max-width:1100px;
  margin:15px auto;
  padding:0 15px
}

#searchInput{
  width:100%;
  padding:14px 16px;
  border:1px solid #d7dce5;
  border-radius:12px;
  outline:0;
  font-size:16px;
  background:#fff
}

.categories{
  max-width:1100px;
  margin:15px auto;
  padding:0 15px;
  display:flex;
  gap:8px;
  overflow-x:auto
}

.category-btn{
  border:1px solid #cfd6df;
  background:#fff;
  padding:9px 15px;
  border-radius:20px;
  cursor:pointer;
  white-space:nowrap
}

.category-btn.active{
  background:#087f5b;
  color:#fff;
  border-color:#087f5b
}

.products{
  max-width:1100px;
  margin:20px auto 60px;
  padding:0 15px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:16px
}

.card{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 4px 15px rgba(0,0,0,.07)
}

.product-image{
  width:100%;
  height:190px;
  object-fit:cover;
  background:#eef2f5
}

.card-content{padding:14px}

.product-name{
  font-size:18px;
  font-weight:700;
  margin-bottom:7px
}

.type{
  display:inline-block;
  font-size:12px;
  padding:5px 8px;
  background:#e7f8f1;
  color:#087f5b;
  border-radius:6px;
  margin-bottom:8px
}

.company{
  color:#70798a;
  font-size:14px;
  margin-bottom:8px
}

.price{
  font-size:20px;
  font-weight:800;
  color:#087f5b;
  margin-bottom:12px
}

.view-btn{
  width:100%;
  padding:11px;
  border:0;
  background:#087f5b;
  color:#fff;
  border-radius:9px;
  cursor:pointer;
  font-weight:700
}

.loading,.empty{
  grid-column:1/-1;
  text-align:center;
  padding:50px;
  color:#087f5b;
  font-weight:700
}

/* MODALS */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:500;
  padding:18px;
  overflow-y:auto
}

.modal-box{
  max-width:500px;
  margin:25px auto;
  background:#fff;
  border-radius:18px;
  padding:20px;
  position:relative
}

.close{
  position:absolute;
  right:13px;
  top:10px;
  border:0;
  background:#f0f2f5;
  width:35px;
  height:35px;
  border-radius:50%;
  cursor:pointer;
  font-size:20px
}

.modal-image{
  width:100%;
  max-height:300px;
  object-fit:cover;
  border-radius:12px;
  margin-bottom:15px
}

.detail-row{
  padding:9px 0;
  border-bottom:1px solid #eee;
  font-size:14px
}

.detail-row strong{
  display:inline-block;
  min-width:105px
}

/* WHATSAPP */

.whatsapp-btn{
  display:block;
  text-align:center;
  text-decoration:none;
  background:#25D366;
  color:#fff;
  padding:13px;
  border-radius:10px;
  margin-top:18px;
  font-weight:800;
  cursor:pointer
}

.wa-option{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  margin-top:10px;
  background:#25D366;
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer
}

/* LOGIN */

.login-box h2{
  text-align:center;
  color:#087f5b;
  margin-bottom:20px
}

.input-group{margin-bottom:13px}

.input-group label{
  display:block;
  margin-bottom:6px;
  font-weight:700;
  font-size:14px
}

.input-group input,
.input-group select,
.input-group textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccd3dc;
  border-radius:9px;
  outline:0;
  font-size:15px
}

.input-group textarea{
  min-height:90px;
  resize:vertical
}

.primary-btn{
  width:100%;
  padding:13px;
  background:#087f5b;
  color:#fff;
  border:0;
  border-radius:9px;
  cursor:pointer;
  font-weight:800;
  font-size:15px
}

.logout-btn{
  background:#d63031;
  color:#fff;
  border:0;
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700
}

.edit-btn{
  background:#1971c2;
  color:#fff;
  border:0;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700
}

.delete-btn{
  background:#d63031;
  color:#fff;
  border:0;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700
}

.admin-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:18px
}

.admin-header h2{color:#087f5b}

.admin-product{
  border:1px solid #e1e5eb;
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
  background:#fafafa
}

.admin-product-top{
  display:flex;
  gap:12px;
  align-items:center
}

.admin-thumb{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:8px;
  background:#eee
}

.admin-info{flex:1}

.admin-info h4{margin-bottom:4px}

.admin-info p{
  color:#687386;
  font-size:13px
}

.admin-actions{
  display:flex;
  gap:8px;
  margin-top:10px
}

.admin-actions button{flex:1}

.error{
  background:#ffecec;
  color:#c0392b;
  padding:10px;
  border-radius:8px;
  margin-top:10px;
  display:none;
  font-size:14px
}

.success{
  background:#e7f8f1;
  color:#087f5b;
  padding:10px;
  border-radius:8px;
  margin-top:10px;
  display:none;
  font-size:14px
}

@media(max-width:600px){
  .logo{font-size:17px}
  .hero h1{font-size:24px}
  .products{
    grid-template-columns:repeat(2,1fr);
    gap:10px
  }
  .product-image{height:150px}
  .product-name{font-size:16px}
  .price{font-size:18px}
}

@media(max-width:380px){
  .products{grid-template-columns:1fr}
}
</style>
</head>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  updateDoc,
  deleteDoc,
  doc
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
  apiKey: "AIzaSyAvW--1xLttocESRPTR2NRAd_SHI90pIq0",
  authDomain: "janakinath-bhander.firebaseapp.com",
  projectId: "janakinath-bhander",
  storageBucket: "janakinath-bhander.firebasestorage.app",
  messagingSenderId: "180668389458",
  appId: "1:180668389458:web:eb0aa44c8030373ff3a78b",
  measurementId: "G-DKL4LQT2VY"
};


/* START FIREBASE */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* ADMIN UID */

const ADMIN_UID =
"estDvqfCQHWVYXM8sanrqIUniey1";


/* VARIABLES */

let allProducts = [];

let currentCategory = "All";

let selectedProduct = null;

let editingId = null;


/* LOAD PRODUCTS */

async function loadProducts(){

  const productsContainer =
    document.getElementById("products");

  productsContainer.innerHTML =
    '<div class="loading">Loading products...</div>';

  try{

    const snapshot =
      await getDocs(collection(db,"products"));

    allProducts = [];

    snapshot.forEach((item)=>{

      allProducts.push({
        id:item.id,
        ...item.data()
      });

    });

    renderProducts();

  }catch(error){

    console.error(error);

    productsContainer.innerHTML =
      '<div class="empty">Unable to load products.</div>';

  }

}


/* RENDER PRODUCTS */

function renderProducts(){

  const container =
    document.getElementById("products");

  const search =
    document.getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();

  let filtered =
    allProducts.filter(product=>{

      const matchesSearch =
        !search ||
        String(product.name||"")
          .toLowerCase()
          .includes(search) ||

        String(product.company||"")
          .toLowerCase()
          .includes(search) ||

        String(product.code||"")
          .toLowerCase()
          .includes(search);

      const matchesCategory =
        currentCategory === "All" ||
        product.type === currentCategory;

      return matchesSearch && matchesCategory;

    });


  if(filtered.length === 0){

    container.innerHTML =
      '<div class="empty">No products found.</div>';

    return;

  }


  container.innerHTML =
    filtered.map(product=>{

      const image =
        product.image ||
        "https://via.placeholder.com/500x400?text=JANAKINATH+BHANDER";

      return `

        <div class="card">

          <img
            class="product-image"
            src="${escapeHtml(image)}"
            alt="${escapeHtml(product.name||"Product")}"
            onerror="this.src='https://via.placeholder.com/500x400?text=No+Image'"
          >

          <div class="card-content">

            <div class="product-name">
              ${escapeHtml(product.name || "Unnamed Product")}
            </div>

            <span class="type">
              ${escapeHtml(product.type || "Other")}
            </span>

            <div class="company">
              ${escapeHtml(product.company || "Company not specified")}
            </div>

            <div class="price">
              ₹${escapeHtml(String(product.price ?? "0"))}
            </div>

            <button
              class="view-btn"
              onclick="showDetails('${product.id}')"
            >
              View Details
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* SEARCH */

document
  .getElementById("searchInput")
  .addEventListener("input",renderProducts);


/* CATEGORY */

window.setCategory =
function(category,button){

  currentCategory = category;

  document
    .querySelectorAll(".category-btn")
    .forEach(btn=>btn.classList.remove("active"));

  button.classList.add("active");

  renderProducts();

};


/* DETAILS */

window.showDetails =
function(id){

  const product =
    allProducts.find(p=>p.id===id);

  if(!product)return;

  selectedProduct = product;

  document.getElementById("detailImage").src =
    product.image ||
    "https://via.placeholder.com/500x400?text=No+Image";

  document.getElementById("detailName").textContent =
    product.name || "";

  document.getElementById("detailPrice").textContent =
    product.price ?? "";

  document.getElementById("detailType").textContent =
    product.type || "";

  document.getElementById("detailCompany").textContent =
    product.company || "";

  document.getElementById("detailPack").textContent =
    product.pack || "";

  document.getElementById("detailStock").textContent =
    product.stock || "";

  document.getElementById("detailCode").textContent =
    product.code || "";

  document.getElementById("detailDescription").textContent =
    product.description || "";

  document.getElementById("detailsModal").style.display =
    "block";

};


/* WHATSAPP OPTIONS */

window.openWhatsAppOptions =
function(){

  if(!selectedProduct)return;

  document.getElementById("whatsappModal").style.display =
    "block";

};


/* WHATSAPP */

window.sendWhatsApp =
function(number){

  if(!selectedProduct)return;

  const p = selectedProduct;

  const message =
`Hello JANAKINATH BHANDER,

This product is available:

Product Name: ${p.name || ""}
Price: ₹${p.price || ""}
Type: ${p.type || ""}
Company: ${p.company || ""}
Pack Size: ${p.pack || ""}
Product Code: ${p.code || ""}

I want to know more about this product.`;

  const url =
    "https://wa.me/" +
    number +
    "?text=" +
    encodeURIComponent(message);

  window.open(url,"_blank");

};


/* OPEN LOGIN */

window.openLogin =
function(){

  document.getElementById("loginError").style.display =
    "none";

  document.getElementById("loginModal").style.display =
    "block";

};


/* ADMIN LOGIN */

window.adminLogin =
async function(){

  const email =
    document.getElementById("adminEmail").value.trim();

  const password =
    document.getElementById("adminPassword").value;

  const errorBox =
    document.getElementById("loginError");

  errorBox.style.display = "none";

  if(!email || !password){

    errorBox.textContent =
      "Please enter Gmail and password.";

    errorBox.style.display = "block";

    return;

  }


  try{

    const result =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    if(result.user.uid !== ADMIN_UID){

      await signOut(auth);

      errorBox.textContent =
        "Access denied. You are not the Admin.";

      errorBox.style.display = "block";

      return;

    }


    document.getElementById("loginModal").style.display =
      "none";

    document.getElementById("adminModal").style.display =
      "block";

    loadAdminProducts();

  }catch(error){

    console.error(error);

    errorBox.textContent =
      "Wrong Gmail or password.";

    errorBox.style.display = "block";

  }

};


/* AUTH STATE */

onAuthStateChanged(auth,(user)=>{

  if(user && user.uid === ADMIN_UID){

    // Admin already authenticated

  }

});


/* LOGOUT */

window.adminLogout =
async function(){

  await signOut(auth);

  document.getElementById("adminModal").style.display =
    "none";

};


/* ADD / UPDATE PRODUCT */

document
  .getElementById("productForm")
  .addEventListener("submit",async function(e){

    e.preventDefault();

    const errorBox =
      document.getElementById("adminError");

    const successBox =
      document.getElementById("adminSuccess");

    errorBox.style.display = "none";
    successBox.style.display = "none";


    const user = auth.currentUser;

    if(!user || user.uid !== ADMIN_UID){

      errorBox.textContent =
        "Admin authentication required.";

      errorBox.style.display = "block";

      return;

    }


    const product = {

      name:
        document.getElementById("productName").value.trim(),

      image:
        document.getElementById("productImage").value.trim(),

      price:
        document.getElementById("productPrice").value,

      type:
        document.getElementById("productType").value,

      company:
        document.getElementById("productCompany").value.trim(),

      pack:
        document.getElementById("productPack").value.trim(),

      stock:
        document.getElementById("productStock").value.trim(),

      code:
        document.getElementById("productCode").value.trim(),

      description:
        document.getElementById("productDescription").value.trim()

    };


    try{

      if(editingId){

        await updateDoc(
          doc(db,"products",editingId),
          product
        );

        successBox.textContent =
          "Product updated successfully!";

      }else{

        await addDoc(
          collection(db,"products"),
          product
        );

        successBox.textContent =
          "Product added successfully!";

      }


      successBox.style.display = "block";

      resetForm();

      await loadProducts();

      await loadAdminProducts();


    }catch(error){

      console.error(error);

      errorBox.textContent =
        "Could not save product. Check Firebase Rules.";

      errorBox.style.display = "block";

    }

  });


/* ADMIN PRODUCT LIST */

async function loadAdminProducts(){

  const list =
    document.getElementById("adminProductList");

  list.innerHTML =
    "Loading...";


  try{

    const snapshot =
      await getDocs(collection(db,"products"));

    if(snapshot.empty){

      list.innerHTML =
        "<p>No products added yet.</p>";

      return;

    }


    list.innerHTML = "";


    snapshot.forEach(item=>{

      const p = item.data();

      const div =
        document.createElement("div");

      div.className =
        "admin-product";

      div.innerHTML = `

        <div class="admin-product-top">

          <img
            class="admin-thumb"
            src="${escapeHtml(p.image || "https://via.placeholder.com/100?text=No+Image")}"
            onerror="this.src='https://via.placeholder.com/100?text=No+Image'"
          >

          <div class="admin-info">

            <h4>
              ${escapeHtml(p.name || "Unnamed Product")}
            </h4>

            <p>
              ₹${escapeHtml(String(p.price ?? "0"))}
              •
              ${escapeHtml(p.type || "Other")}
            </p>

          </div>

        </div>

        <div class="admin-actions">

          <button
            class="edit-btn"
            onclick="editProduct('${item.id}')"
          >
            Edit
          </button>

          <button
            class="delete-btn"
            onclick="deleteProduct('${item.id}')"
          >
            Delete
          </button>

        </div>

      `;

      list.appendChild(div);

    });

  }catch(error){

    console.error(error);

    list.innerHTML =
      "<p>Unable to load admin products.</p>";

  }

}


/* EDIT PRODUCT */

window.editProduct =
function(id){

  const product =
    allProducts.find(p=>p.id===id);

  if(!product)return;

  editingId = id;

  document.getElementById("productName").value =
    product.name || "";

  document.getElementById("productImage").value =
    product.image || "";

  document.getElementById("productPrice").value =
    product.price || "";

  document.getElementById("productType").value =
    product.type || "Medicine";

  document.getElementById("productCompany").value =
    product.company || "";

  document.getElementById("productPack").value =
    product.pack || "";

  document.getElementById("productStock").value =
    product.stock || "";

  document.getElementById("productCode").value =
    product.code || "";

  document.getElementById("productDescription").value =
    product.description || "";

  document.getElementById("saveBtn").textContent =
    "💾 Update Product";

  document.getElementById("cancelEditBtn").style.display =
    "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


/* DELETE */

window.deleteProduct =
async function(id){

  const user = auth.currentUser;

  if(!user || user.uid !== ADMIN_UID){

    alert("Admin authentication required.");

    return;

  }


  if(!confirm("Delete this product?"))return;


  try{

    await deleteDoc(
      doc(db,"products",id)
    );

    alert("Product deleted successfully.");

    await loadProducts();

    await loadAdminProducts();

  }catch(error){

    console.error(error);

    alert("Could not delete product.");

  }

};


/* CANCEL EDIT */

window.cancelEdit =
function(){

  resetForm();

};


/* RESET FORM */

function resetForm(){

  editingId = null;

  document.getElementById("productForm").reset();

  document.getElementById("saveBtn").textContent =
    "➕ Add Product";

  document.getElementById("cancelEditBtn").style.display =
    "none";

}


/* CLOSE MODAL */

window.closeModal =
function(id){

  document.getElementById(id).style.display =
    "none";

};


/* CLOSE WHEN CLICK OUTSIDE */

window.addEventListener("click",(event)=>{

  document
    .querySelectorAll(".modal")
    .forEach(modal=>{

      if(event.target === modal){

        modal.style.display = "none";

      }

    });

});


/* ESCAPE HTML */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* INITIAL LOAD */

loadProducts();

</script>
